<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobileye Dining Ratings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f9ff; color: #1e293b; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 2px solid #e0f2fe; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border-radius: 16px; font-weight: 700; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .star-rating { cursor: pointer; font-size: 2rem; transition: transform 0.2s ease; }
        .star-rating:hover { transform: scale(1.2); }
        .star-active { color: #fbbf24; filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
        .star-inactive { color: #d1d5db; }
        .input-field { background: white; border: 2px solid #e2e8f0; color: #1e293b; border-radius: 12px; padding: 12px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #3b82f6; }
        .category-badge { padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .main-badge { background: #dcfce7; color: #166534; }
        .soup-badge { background: #fef9c3; color: #854d0e; }
        .dessert-badge { background: #fae8ff; color: #86198f; }
        .section-header { position: relative; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .section-header::after { content: ''; position: absolute; left: 0; bottom: 0; width: 50px; height: 4px; border-radius: 2px; }
        .header-main::after { background: #22c55e; }
        .header-soup::after { background: #eab308; }
        .header-dessert::after { background: #d946ef; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKiGApRlBxU2wd1Y7RIWcDqJxoOpZHORA",
            authDomain: "mobileye-dining-ratings.firebaseapp.com",
            projectId: "mobileye-dining-ratings",
            storageBucket: "mobileye-dining-ratings.firebasestorage.app",
            messagingSenderId: "428654044774",
            appId: "1:428654044774:web:05fb0c7c043c52e8306fa7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const { useState, useEffect } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [menu, setMenu] = useState(null);
            const [todayStr] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => {
                return auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const adminDoc = await db.collection('admins').doc(u.email).get();
                        setIsAdmin(adminDoc.exists);
                    }
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = db.collection('menus').doc(todayStr).onSnapshot(doc => {
                    if (doc.exists) setMenu(doc.data());
                    else setMenu(null);
                });
                return unsub;
            }, [user]);

            if (loading) return React.createElement('div', { className: 'flex items-center justify-center min-h-screen text-blue-500 font-bold text-xl' }, 'Gathering the ingredients...');
            if (!user) return React.createElement(Login);

            return React.createElement('div', { className: 'max-w-4xl mx-auto p-4 md:p-8' }, [
                React.createElement('header', { className: 'flex flex-col md:flex-row justify-between items-center mb-12 gap-4', key: 'header' }, [
                    React.createElement('div', { className: 'text-center md:text-left' }, [
                        React.createElement('h1', { className: 'text-4xl md:text-5xl font-black text-blue-600 tracking-tight' }, 'Yum-O-Meter'),
                        React.createElement('p', { className: 'text-blue-400 font-bold flex items-center justify-center md:justify-start gap-2' }, [
                            React.createElement('span', { className: 'text-xl' }, '🚗'),
                            'MOBILEYE JERUSALEM'
                        ])
                    ]),
                    React.createElement('div', { className: 'glass-card p-4 flex items-center gap-4' }, [
                        React.createElement('div', { className: 'text-right hidden sm:block' }, [
                            React.createElement('p', { className: 'text-sm font-bold text-gray-600' }, user.email),
                            React.createElement('button', { onClick: () => auth.signOut(), className: 'text-xs font-black text-red-500 hover:text-red-600 uppercase tracking-tighter' }, '👋 Sign Out')
                        ]),
                        React.createElement('div', { className: 'w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-xl' }, '😋')
                    ])
                ]),
                isAdmin && React.createElement(AdminPanel, { todayStr, key: 'admin' }),
                React.createElement(RatingSection, { menu, todayStr, key: 'rating' })
            ]);
        }

        function Login() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                if (!email.toLowerCase().endsWith('@mobileye.com')) {
                    setError('Oops! Use your @mobileye.com email.');
                    return;
                }
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError(err.message); }
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100' },
                React.createElement('div', { className: 'glass-card p-8 w-full max-w-md text-center' }, [
                    React.createElement('div', { className: 'text-5xl mb-6' }, '🍔'),
                    React.createElement('h2', { className: 'text-3xl font-black text-gray-800 mb-2' }, isRegister ? 'Join the Foodies' : 'Welcome Back!'),
                    React.createElement('p', { className: 'text-gray-500 mb-8 font-medium' }, 'Rate your Mobileye meals & help us improve!'),
                    error && React.createElement('p', { className: 'bg-red-50 text-red-500 p-3 rounded-xl mb-6 text-sm font-bold' }, error),
                    React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' }, [
                        React.createElement('input', { type: 'email', placeholder: 'name@mobileye.com', value: email, onChange: e => setEmail(e.target.value), className: 'input-field', required: true }),
                        React.createElement('input', { type: 'password', placeholder: 'Secret Password', value: password, onChange: e => setPassword(e.target.value), className: 'input-field', required: true }),
                        React.createElement('button', { type: 'submit', className: 'btn-primary w-full py-4 text-lg' }, isRegister ? 'Let\'s Go! 🚀' : 'Sign In 🔑')
                    ]),
                    React.createElement('button', { onClick: () => setIsRegister(!isRegister), className: 'mt-8 text-blue-500 font-bold hover:underline text-sm' },
                        isRegister ? 'Already a member? Sign in' : 'New here? Create an account')
                ])
            );
        }

        function AdminPanel({ todayStr }) {
            const [form, setForm] = useState({
                main: ['', '', '', ''],
                soups: ['', ''],
                desserts: ['', '', '']
            });

            useEffect(() => {
                db.collection('menus').doc(todayStr).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setForm({
                            main: data.main || ['', '', '', ''],
                            soups: data.soups || ['', ''],
                            desserts: data.desserts || ['', '', '']
                        });
                    }
                });
            }, [todayStr]);

            const save = () => db.collection('menus').doc(todayStr).set(form);

            const InputGroup = (label, type, size, emoji) => React.createElement('div', { className: 'space-y-3' }, [
                React.createElement('h4', { className: 'font-black text-gray-700 flex items-center gap-2' }, [
                    React.createElement('span', null, emoji),
                    label
                ]),
                ...Array(size).fill(0).map((_, i) => React.createElement('input', {
                    key: i,
                    placeholder: `${label} option ${i + 1}`,
                    value: form[type][i],
                    onChange: e => {
                        const newArr = [...form[type]];
                        newArr[i] = e.target.value;
                        setForm({ ...form, [type]: newArr });
                    },
                    className: 'input-field'
                }))
            ]);

            return React.createElement('div', { className: 'glass-card p-6 md:p-8 mb-12 border-blue-200' }, [
                React.createElement('h3', { className: 'text-2xl font-black text-blue-600 mb-8 flex items-center gap-3' }, [
                    React.createElement('span', { className: 'bg-blue-600 text-white p-2 rounded-lg text-sm' }, 'ADM'),
                    'Setup Today\'s Menu'
                ]),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-8 mb-8' }, [
                    InputGroup('Main Dishes', 'main', 4, '🍖'),
                    InputGroup('Soups', 'soups', 2, '🥣'),
                    InputGroup('Desserts', 'desserts', 3, '🍰')
                ]),
                React.createElement('button', { onClick: save, className: 'btn-primary px-8 py-3' }, 'Update Menu ✨')
            ]);
        }

        function RatingSection({ menu, todayStr }) {
            if (!menu) return React.createElement('div', { className: 'glass-card p-12 text-center' }, [
                React.createElement('div', { className: 'text-6xl mb-6' }, '👨‍🍳'),
                React.createElement('h2', { className: 'text-2xl font-black text-gray-800' }, 'Chef is preparing the menu...'),
                React.createElement('p', { className: 'text-gray-500 font-medium' }, 'Check back in a few minutes!')
            ]);

            return React.createElement('div', { className: 'space-y-12' }, [
                React.createElement(RatingGroup, { title: 'Main Courses & Dishes', items: menu.main, type: 'main', todayStr, badgeClass: 'main-badge', icon: '🍖', headerClass: 'header-main' }),
                React.createElement(RatingGroup, { title: 'Today\'s Soups', items: menu.soups, type: 'soups', todayStr, badgeClass: 'soup-badge', icon: '🥣', headerClass: 'header-soup' }),
                React.createElement(RatingGroup, { title: 'Sweet Desserts', items: menu.desserts, type: 'desserts', todayStr, badgeClass: 'dessert-badge', icon: '🍰', headerClass: 'header-dessert' })
            ]);
        }

        function RatingGroup({ title, items, type, todayStr, badgeClass, icon, headerClass }) {
            const filteredItems = (items || []).filter(i => i.trim() !== '');
            if (filteredItems.length === 0) return null;

            return React.createElement('section', null, [
                React.createElement('div', { className: `flex items-center gap-3 section-header ${headerClass}` }, [
                    React.createElement('span', { className: 'text-3xl' }, icon),
                    React.createElement('h2', { className: 'text-2xl font-black text-gray-800' }, title)
                ]),
                React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' },
                    filteredItems.map((item, idx) => React.createElement(DishCard, { key: idx, dish: item, category: type, todayStr, badgeClass }))
                )
            ]);
        }

        function DishCard({ dish, category, todayStr, badgeClass }) {
            const [rating, setRating] = useState(0);
            const [comment, setComment] = useState('');
            const [stats, setStats] = useState({ avg: 0, count: 0 });
            const [hasRated, setHasRated] = useState(false);
            const user = auth.currentUser;

            useEffect(() => {
                const docId = `${todayStr}_${category}_${dish}`;
                const unsub = db.collection('ratings').where('dishId', '==', docId).onSnapshot(snap => {
                    const ratings = snap.docs.map(d => d.data().rating);
                    const avg = ratings.length ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : 0;
                    setStats({ avg, count: snap.size });
                    
                    const myRating = snap.docs.find(d => d.data().userId === user.uid);
                    if (myRating) {
                        setRating(myRating.data().rating);
                        setComment(myRating.data().comment || '');
                        setHasRated(true);
                    }
                });
                return unsub;
            }, [dish, todayStr]);

            const submitRating = async (r) => {
                const docId = `${user.uid}_${todayStr}_${category}_${dish}`;
                await db.collection('ratings').doc(docId).set({
                    userId: user.uid,
                    dishId: `${todayStr}_${category}_${dish}`,
                    rating: r,
                    comment,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const getReaction = (val) => {
                if (val >= 4.5) return '👑';
                if (val >= 4) return '🔥';
                if (val >= 3) return '👌';
                if (val > 0) return '😴';
                return '😶';
            };

            const cleanCategory = category === 'main' ? 'Main' : category === 'soups' ? 'Soup' : 'Dessert';

            return React.createElement('div', { className: `glass-card p-6 flex flex-col h-full transition-all ${hasRated ? 'border-green-200 bg-green-50/30' : 'hover:border-blue-300'}` }, [
                React.createElement('div', { className: 'flex justify-between items-start mb-4' }, [
                    React.createElement('span', { className: `category-badge ${badgeClass}` }, cleanCategory),
                    stats.count > 0 && React.createElement('div', { className: 'text-right' }, [
                        React.createElement('div', { className: 'text-2xl font-black text-gray-800 flex items-center gap-1' }, [
                            getReaction(stats.avg),
                            stats.avg
                        ]),
                        React.createElement('div', { className: 'text-[10px] font-bold text-gray-400 uppercase' }, `${stats.count} votes`)
                    ])
                ]),
                React.createElement('h3', { className: 'text-xl font-black text-gray-800 mb-6 leading-tight flex-grow' }, dish),
                React.createElement('div', { className: 'flex justify-center gap-2 mb-6' },
                    [1, 2, 3, 4, 5].map(star => React.createElement('span', {
                        key: star,
                        onClick: () => submitRating(star),
                        className: `star-rating ${star <= rating ? 'star-active' : 'star-inactive'}`
                    }, star <= rating ? '⭐' : '☆'))
                ),
                React.createElement('input', {
                    placeholder: 'Add a comment...',
                    value: comment,
                    onChange: e => setComment(e.target.value),
                    onBlur: () => rating > 0 && submitRating(rating),
                    className: 'input-field text-sm font-medium'
                })
            ]);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
