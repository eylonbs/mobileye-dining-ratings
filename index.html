<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobileye Dining Ratings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f9ff; color: #1e293b; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 2px solid #e0f2fe; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border-radius: 16px; font-weight: 700; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .star-rating { cursor: pointer; font-size: 2rem; transition: transform 0.2s ease; }
        .star-rating:hover { transform: scale(1.2); }
        .star-active { color: #fbbf24; filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
        .star-inactive { color: #d1d5db; }
        .input-field { background: white; border: 2px solid #e2e8f0; color: #1e293b; border-radius: 12px; padding: 12px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #3b82f6; }
        .category-badge { padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .main-badge { background: #dcfce7; color: #166534; }
        .soup-badge { background: #fef9c3; color: #854d0e; }
        .dessert-badge { background: #fae8ff; color: #86198f; }
        .vegan-cat-badge { background: #d1fae5; color: #047857; }
        .fish-badge { background: #e0f2fe; color: #0369a1; }
        .leaderboard-card { border: 2px solid transparent; background-clip: padding-box; }
        .leaderboard-gold { border-color: #fbbf24; background-color: #fffbeb; }
        .leaderboard-red { border-color: #ef4444; background-color: #fef2f2; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .tab-button { border-radius: 9999px; padding: 6px 14px; font-weight: 700; }
        .tab-active { background-color: #0ea5e9; color: white; }
        .tab-inactive { background-color: #e0f2fe; color: #0369a1; }
        .dish-rating-badge { 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 0.85rem; 
            font-weight: 700; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px;
        }
        .rating-great {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.3);
        }
        .rating-good {
            background: linear-gradient(135deg, #84cc16, #65a30d);
            color: white;
            box-shadow: 0 2px 4px rgba(132, 204, 22, 0.3);
        }
        .rating-okay {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #78350f;
            box-shadow: 0 2px 4px rgba(251, 191, 36, 0.3);
        }
        .rating-poor {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 2px 4px rgba(249, 115, 22, 0.3);
        }
        .rating-bad {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
        }
        .vegan-badge {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .vegan-filter-btn {
            border: 2px solid #22c55e;
            border-radius: 9999px;
            padding: 6px 14px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .vegan-filter-active {
            background-color: #22c55e;
            color: white;
        }
        .vegan-filter-inactive {
            background-color: white;
            color: #22c55e;
        }
        .comment-field { 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 10px; 
            width: 100%; 
            min-height: 60px; 
            resize: vertical; 
            font-family: inherit; 
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .comment-field:focus { border-color: #3b82f6; }
        .comment-field::placeholder { color: #94a3b8; }
        .weekly-day-card { 
            background: rgba(255, 255, 255, 0.9); 
            border-radius: 16px; 
            border: 2px solid #e0f2fe;
            overflow: hidden;
        }
        .weekly-day-header { 
            background: linear-gradient(135deg, #0ea5e9, #2563eb); 
            color: white; 
            padding: 12px 16px; 
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKiGApRlBxU2wd1Y7RIWcDqJxoOpZHORA",
            authDomain: "mobileye-dining-ratings.firebaseapp.com",
            projectId: "mobileye-dining-ratings",
            storageBucket: "mobileye-dining-ratings.firebasestorage.app",
            messagingSenderId: "428654044774",
            appId: "1:428654044774:web:05fb0c7c043c52e8306fa7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const { useState, useEffect, useMemo } = React;

        // GitHub Pages menu files are named menu-data-{mon}-{year}.json; scrape-and-upload.js
        // names the file from the menu week's Sunday, while the browser used to only ask for
        // "current calendar month" — try nearby months so cross-month weeks still resolve.
        const MENU_MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

        function menuJsonMonthYearSuffixes(baseDate) {
            const y = baseDate.getFullYear();
            const m = baseDate.getMonth();
            const seen = new Set();
            const out = [];
            for (const delta of [0, -1, 1, -2, 2]) {
                const d = new Date(y, m + delta, 1);
                const key = `${MENU_MONTHS[d.getMonth()]}-${d.getFullYear()}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    out.push(key);
                }
            }
            return out;
        }

        async function loadMenuDataForToday(todayStr) {
            const now = new Date();
            for (const suffix of menuJsonMonthYearSuffixes(now)) {
                try {
                    const response = await fetch(`menu-data-${suffix}.json`);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data && data[todayStr]) return data[todayStr];
                } catch (e) {
                    /* try next candidate */
                }
            }
            return null;
        }

        async function loadFullMenuJson() {
            const now = new Date();
            let lastMessage = 'Failed to load menu';
            for (const suffix of menuJsonMonthYearSuffixes(now)) {
                try {
                    const response = await fetch(`menu-data-${suffix}.json`);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
                        return data;
                    }
                } catch (e) {
                    if (e && e.message) lastMessage = e.message;
                }
            }
            throw new Error(lastMessage);
        }

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [menu, setMenu] = useState(null);
            const [allRatings, setAllRatings] = useState([]);
            // Use local timezone for date (not UTC)
            const [todayStr] = useState(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            });
            const [activeTab, setActiveTab] = useState('today'); // 'today' | 'history' | 'weekly'

            useEffect(() => {
                return auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const adminDoc = await db.collection('admins').doc(u.email).get();
                        setIsAdmin(adminDoc.exists);
                    }
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const menuUnsub = db.collection('menus').doc(todayStr).onSnapshot(async doc => {
                    // Always try to load from JSON first (has all categories including plantBased)
                    let jsonMenu = null;
                    try {
                        jsonMenu = await loadMenuDataForToday(todayStr);
                    } catch (e) {
                        console.log('No JSON menu file found');
                    }
                    if (!jsonMenu) {
                        console.log('No JSON menu entry for', todayStr);
                    }
                    
                    // Use JSON if available (has plantBased), otherwise fall back to Firebase
                    if (jsonMenu && jsonMenu.plantBased && jsonMenu.plantBased.length > 0) {
                        setMenu(jsonMenu);
                    } else if (doc.exists && doc.data().main && doc.data().main.length > 0) {
                        setMenu(doc.data());
                    } else if (jsonMenu) {
                        setMenu(jsonMenu);
                    } else {
                        setMenu(null);
                    }
                });
                const ratingsUnsub = db.collection('ratings').where('todayStr', '==', todayStr).onSnapshot(snap => {
                    setAllRatings(snap.docs.map(d => d.data()));
                });
                return () => { menuUnsub(); ratingsUnsub(); };
            }, [user, todayStr]);

            const dishStats = useMemo(() => {
                const stats = {};
                allRatings.forEach(r => {
                    if (!stats[r.dishId]) stats[r.dishId] = { sum: 0, count: 0, dishName: r.dishName, category: r.category };
                    stats[r.dishId].sum += r.rating;
                    stats[r.dishId].count += 1;
                });
                return Object.entries(stats)
                    .map(([id, s]) => ({
                        id,
                        ...s,
                        avg: (s.sum / s.count).toFixed(1)
                    }))
                    .filter(item => !isNaN(parseFloat(item.avg)))
                    .sort((a, b) => b.avg - a.avg);
            }, [allRatings]);

            if (loading) {
                return React.createElement('div', { className: 'flex items-center justify-center min-h-screen text-blue-500 font-bold text-xl' }, 'Gathering the ingredients...');
            }
            if (!user) return React.createElement(Login);

            return React.createElement('div', { className: 'max-w-4xl mx-auto p-4 md:p-8' }, [
                React.createElement('header', { className: 'flex flex-col md:flex-row justify-between items-center mb-6 gap-4', key: 'header' }, [
                    React.createElement('div', { className: 'text-center md:text-left' }, [
                        React.createElement('h1', { className: 'text-4xl md:text-5xl font-black text-blue-600 tracking-tight' }, 'Yum-O-Meter'),
                        React.createElement('p', { className: 'text-blue-400 font-bold flex items-center justify-center md:justify-start gap-2' }, '🚗 MOBILEYE JERUSALEM'),
                        React.createElement('a', {
                            href: 'https://github.com/eylonbs/mobileye-dining-ratings',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            className: 'inline-flex items-center justify-center mt-2 w-9 h-9 rounded-full bg-black hover:bg-gray-800 transition-colors',
                            'aria-label': 'View on GitHub'
                        }, React.createElement('svg', {
                            xmlns: 'http://www.w3.org/2000/svg',
                            viewBox: '0 0 24 24',
                            fill: 'white',
                            className: 'w-5 h-5'
                        }, React.createElement('path', {
                            d: 'M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.11.79-.25.79-.55 0-.27-.01-1-.02-1.96-3.2.69-3.88-1.54-3.88-1.54-.53-1.35-1.3-1.71-1.3-1.71-1.06-.72.08-.71.08-.71 1.18.08 1.8 1.21 1.8 1.21 1.04 1.78 2.74 1.27 3.41.97.11-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.3 1.2-3.11-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.19a11 11 0 0 1 2.9-.39c.99 0 1.99.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.64 1.58.24 2.75.12 3.04.75.81 1.2 1.85 1.2 3.11 0 4.43-2.69 5.4-5.25 5.68.42.36.8 1.09.8 2.2 0 1.59-.01 2.87-.01 3.26 0 .31.21.67.8.55A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z'
                        })))
                    ]),
                    React.createElement('div', { className: 'glass-card p-4 flex items-center gap-4' }, [
                        React.createElement('div', { className: 'text-right' }, [
                            React.createElement('p', { className: 'text-sm font-bold text-gray-600' }, user.email),
                            React.createElement('button', { onClick: () => auth.signOut(), className: 'text-xs font-black text-red-500 uppercase' }, '👋 Sign Out')
                        ])
                    ])
                ]),

                // Tabs
                React.createElement('div', { className: 'flex flex-wrap gap-2 mb-6', key: 'tabs' }, [
                    React.createElement('button', {
                        className: 'tab-button ' + (activeTab === 'today' ? 'tab-active' : 'tab-inactive'),
                        onClick: () => setActiveTab('today')
                    }, 'Today'),
                    React.createElement('button', {
                        className: 'tab-button ' + (activeTab === 'weekly' ? 'tab-active' : 'tab-inactive'),
                        onClick: () => setActiveTab('weekly')
                    }, '📅 Weekly'),
                    React.createElement('button', {
                        className: 'tab-button ' + (activeTab === 'report' ? 'tab-active' : 'tab-inactive'),
                        onClick: () => setActiveTab('report')
                    }, '📊 Daily Report'),
                    React.createElement('button', {
                        className: 'tab-button ' + (activeTab === 'history' ? 'tab-active' : 'tab-inactive'),
                        onClick: () => setActiveTab('history')
                    }, 'History')
                ]),

                isAdmin && React.createElement(AdminPanel, { todayStr, key: 'admin' }),
                activeTab === 'today' && React.createElement(RatingSection, { menu, todayStr, dishStats, key: 'rating' }),
                activeTab === 'weekly' && React.createElement(WeeklyMenuPage, { key: 'weekly' }),
                activeTab === 'report' && React.createElement(DailyReportPage, { key: 'report' }),
                activeTab === 'history' && React.createElement(HistoryPage, { key: 'history' })
            ]);
        }


        function Login() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email.toLowerCase().endsWith('@mobileye.com')) {
                    setError('Use @mobileye.com email!');
                    return;
                }
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError(err.message); }
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4 bg-blue-50' },
                React.createElement('div', { className: 'glass-card p-8 w-full max-w-md text-center' }, [
                    React.createElement('div', { className: 'text-5xl mb-6' }, '🍗'),
                    React.createElement('h2', { className: 'text-3xl font-black text-gray-800 mb-6' }, isRegister ? 'Join Us' : 'Welcome!'),
                    error && React.createElement('p', { className: 'bg-red-50 text-red-500 p-3 rounded-xl mb-6 text-sm' }, error),
                    React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' }, [
                        React.createElement('input', { type: 'email', placeholder: 'name@mobileye.com', value: email, onChange: e => setEmail(e.target.value), className: 'input-field', required: true }),
                        React.createElement('input', { type: 'password', placeholder: 'Password', value: password, onChange: e => setPassword(e.target.value), className: 'input-field', required: true }),
                        React.createElement('button', { type: 'submit', className: 'btn-primary w-full py-4' }, isRegister ? 'Register' : 'Sign In')
                    ]),
                    React.createElement('button', { onClick: () => setIsRegister(!isRegister), className: 'mt-6 text-blue-500 font-bold' },
                        isRegister ? 'Login instead' : 'Create account')
                ])
            );
        }

        function AdminPanel({ todayStr }) {
            const [form, setForm] = useState({ 
                main: ['', '', '', '', ''], 
                plantBased: ['', ''], 
                fish: [''], 
                soups: ['', ''], 
                desserts: ['', '', '', ''] 
            });

            useEffect(() => {
                db.collection('menus').doc(todayStr).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        // Merge with defaults to handle missing fields
                        setForm(prev => ({
                            main: data.main || prev.main,
                            plantBased: data.plantBased || prev.plantBased,
                            fish: data.fish || prev.fish,
                            soups: data.soups || prev.soups,
                            desserts: data.desserts || prev.desserts
                        }));
                    }
                });
            }, [todayStr]);

            const save = () => db.collection('menus').doc(todayStr).set(form);

            const InputGroup = (label, type, size, bgColor = '') => React.createElement('div', { className: `space-y-2 ${bgColor}` }, [
                React.createElement('h4', { className: 'font-black text-gray-600' }, label),
                ...Array(size).fill(0).map((_, i) => React.createElement('input', {
                    key: i,
                    placeholder: `Option ${i + 1}`,
                    value: (form[type] && form[type][i]) || '',
                    onChange: e => {
                        const newArr = [...(form[type] || [])];
                        newArr[i] = e.target.value;
                        setForm({ ...form, [type]: newArr });
                    },
                    className: 'input-field'
                }))
            ]);

            return React.createElement('div', { className: 'glass-card p-6 mb-6' }, [
                React.createElement('h3', { className: 'text-xl font-black mb-6 text-blue-600' }, 'MANAGER DASHBOARD'),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6' }, [
                    InputGroup('🍖 Main Dishes', 'main', 5),
                    InputGroup('🌱 Plant-Based', 'plantBased', 2),
                    InputGroup('🐟 Fish', 'fish', 1),
                    InputGroup('🥣 Soups', 'soups', 2),
                    InputGroup('🍰 Desserts', 'desserts', 4)
                ]),
                React.createElement('button', { onClick: save, className: 'btn-primary px-8 py-3' }, 'Update Menu ✨')
            ]);
        }

        // ===== Rating section: stars with undo + Send button =====
        function RatingSection({ menu, todayStr, dishStats }) {
            const user = auth.currentUser;
            const [selectedRatings, setSelectedRatings] = useState({}); // dishId -> rating 0-5
            const [selectedComments, setSelectedComments] = useState({}); // dishId -> comment string
            const [isSending, setIsSending] = useState(false);
            const [showVeganOnly, setShowVeganOnly] = useState(false);
            
            // General ratings state (salads, sides, cleaning)
            const [generalRatings, setGeneralRatings] = useState({
                salads: 0,
                sideDishes: 0,
                cleaning: 0
            });
            const [generalComments, setGeneralComments] = useState({
                salads: '',
                sideDishes: '',
                cleaning: ''
            });

            // Helper to get dish stats by dishId
            const getDishRating = (dishId) => {
                if (!dishStats) return null;
                return dishStats.find(s => s.id === dishId);
            };

            // Helper to get rating badge class based on score
            const getRatingBadgeClass = (avg) => {
                const score = parseFloat(avg);
                if (score >= 4.5) return 'rating-great';      // 4.5-5.0: Green (excellent)
                if (score >= 3.5) return 'rating-good';       // 3.5-4.5: Lime (good)
                if (score >= 2.5) return 'rating-okay';       // 2.5-3.5: Yellow/Orange (okay)
                if (score >= 1.5) return 'rating-poor';       // 1.5-2.5: Orange (poor)
                return 'rating-bad';                          // 1.0-1.5: Red (bad)
            };

            if (!menu) return React.createElement('div', { className: 'glass-card p-12 text-center' }, "Waiting for today's menu...");

            const buildDishId = (category, dishName) => `${todayStr}_${category}_${dishName}`;

            const handleStarClick = (dishId, star) => {
                setSelectedRatings(prev => {
                    const current = prev[dishId] || 0;
                    const next = current === star ? 0 : star;
                    return { ...prev, [dishId]: next };
                });
            };

            const handleCommentChange = (dishId, comment) => {
                setSelectedComments(prev => ({ ...prev, [dishId]: comment }));
            };

            const hasAnyRating = Object.values(selectedRatings).some(v => v > 0);
            const hasAnyGeneralRating = Object.values(generalRatings).some(v => v > 0);

            const handleSend = async () => {
                if (!user || (!hasAnyRating && !hasAnyGeneralRating) || isSending) return;
                setIsSending(true);
                try {
                    const batch = db.batch();
                    
                    // Dish ratings
                    const payload = Object.entries(selectedRatings)
                        .filter(([_, rating]) => rating > 0)
                        .map(([dishId, rating]) => {
                            const [date, category, ...rest] = dishId.split('_');
                            const dishName = rest.join('_');
                            const comment = selectedComments[dishId] || '';
                            return { dishId, dishName, category, todayStr: date, rating, comment };
                        });

                    payload.forEach(item => {
                        const docId = `${user.uid}_${item.dishId}`;
                        const ref = db.collection('ratings').doc(docId);
                        batch.set(ref, {
                            userId: user.uid,
                            dishId: item.dishId,
                            dishName: item.dishName,
                            category: item.category,
                            todayStr: item.todayStr,
                            rating: item.rating,
                            comment: item.comment,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    
                    // General ratings (salads, side dishes, cleaning)
                    const generalItems = [
                        { key: 'salads', name: 'Salads', category: 'general-salads' },
                        { key: 'sideDishes', name: 'Side Dishes', category: 'general-sides' },
                        { key: 'cleaning', name: 'Cleaning', category: 'general-cleaning' }
                    ];
                    
                    generalItems.forEach(item => {
                        if (generalRatings[item.key] > 0) {
                            const dishId = `${todayStr}_${item.category}_${item.name}`;
                            const docId = `${user.uid}_${dishId}`;
                            const ref = db.collection('ratings').doc(docId);
                            batch.set(ref, {
                                userId: user.uid,
                                dishId: dishId,
                                dishName: item.name,
                                category: item.category,
                                todayStr: todayStr,
                                rating: generalRatings[item.key],
                                comment: generalComments[item.key] || '',
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    });

                    await batch.commit();
                    setSelectedRatings({});
                    setSelectedComments({});

        // ===== History page with monthly stats + CSV =====
        function HistoryPage() {
            const [year, setYear] = useState(new Date().getFullYear());
            const [month, setMonth] = useState(new Date().getMonth() + 1); // 1-12
            const [stats, setStats] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');

            useEffect(() => {
                const load = async () => {
                    setLoading(true);
                    try {
                        const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;
                        const snap = await db.collection('ratings')
                            .where('todayStr', '>=', `${monthPrefix}-01`)
                            .where('todayStr', '<=', `${monthPrefix}-31`)
                            .get();

                        const map = {};
                        snap.forEach(doc => {
                            const d = doc.data();
                            if (!map[d.dishId]) {
                                map[d.dishId] = {
                                    dishId: d.dishId,
                                    dishName: d.dishName || d.dishId,
                                    category: d.category || 'main',
                                    total: 0,
                                    count: 0,
                                    comments: []
                                };
                            }
                            map[d.dishId].total += d.rating;
                            map[d.dishId].count += 1;
                            // Collect comments
                            if (d.comment && d.comment.trim()) {
                                map[d.dishId].comments.push({
                                    comment: d.comment.trim(),
                                    rating: d.rating,
                                    date: d.todayStr
                                });
                            }
                        });

                        const arr = Object.values(map).map(e => ({
                            dishId: e.dishId,
                            dishName: e.dishName,
                            category: e.category,
                            count: e.count,
                            avgRating: e.count > 0 ? e.total / e.count : 0,
                            comments: e.comments
                        }));

                        setStats(arr);
                    } finally {
                        setLoading(false);
                    }
                };
                load();
            }, [year, month]);

            const byCategory = useMemo(() => {
                const groups = { main: [], soups: [], desserts: [] };
                const query = searchQuery.toLowerCase().trim();
                stats.forEach(s => {
                    // Filter by search query if present
                    if (query && !s.dishName.toLowerCase().includes(query)) {
                        return;
                    }
                    const cat = s.category;
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(s);
                });
                Object.keys(groups).forEach(cat => {
                    groups[cat].sort((a, b) => {
                        if (b.avgRating !== a.avgRating) return b.avgRating - a.avgRating;
                        return b.count - a.count;
                    });
                });
                return groups;
            }, [stats, searchQuery]);

            const downloadCsv = () => {
                if (!stats.length) return;
                const header = ['dishId', 'dishName', 'category', 'avgRating', 'count', 'comments'];
                const lines = [
                    header.join(','),
                    ...stats.map(s => {
                        // Format comments as a readable string
                        const commentsStr = s.comments && s.comments.length > 0
                            ? s.comments.map(c => `[${c.date}] ⭐${c.rating}: ${c.comment}`).join(' | ')
                            : '';
                        return [
                            s.dishId,
                            JSON.stringify(s.dishName),
                            s.category,
                            s.avgRating.toFixed(3),
                            s.count,
                            JSON.stringify(commentsStr)
                        ].join(',');
                    })
                ];
                const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const monthStr = String(month).padStart(2, '0');
                a.href = url;
                a.download = `mobileye-dining-${year}-${monthStr}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // State to track expanded comments
            const [expandedDishes, setExpandedDishes] = useState({});
            
            const toggleComments = (dishId) => {
                setExpandedDishes(prev => ({ ...prev, [dishId]: !prev[dishId] }));
            };

            const renderTable = (title, arr) => {
                if (!arr || !arr.length) return null;
                return React.createElement('section', { className: 'glass-card p-4 mb-4' }, [
                    React.createElement('h2', { className: 'text-xl font-black mb-2' }, title),
                    React.createElement('table', { className: 'w-full text-sm' }, [
                        React.createElement('thead', null,
                            React.createElement('tr', { className: 'text-center border-b' }, [
                                React.createElement('th', { className: 'py-1 px-2' }, '#'),
                                React.createElement('th', { className: 'py-1 px-2' }, 'Dish'),
                                React.createElement('th', { className: 'py-1 px-2' }, 'Avg'),
                                React.createElement('th', { className: 'py-1 px-2' }, 'Votes'),
                                React.createElement('th', { className: 'py-1 px-2' }, 'Comments')
                            ])
                        ),
                        React.createElement('tbody', null,
                            arr.flatMap((dish, idx) => {
                                const hasComments = dish.comments && dish.comments.length > 0;
                                const isExpanded = expandedDishes[dish.dishId];
                                
                                const rows = [
                                    React.createElement('tr', { key: dish.dishId, className: 'border-b last:border-0' }, [
                                        React.createElement('td', { className: 'py-1 px-2 text-center' }, idx + 1),
                                        React.createElement('td', { className: 'py-1 px-2 text-center' }, dish.dishName),
                                        React.createElement('td', { className: 'py-1 px-2 text-center' }, dish.avgRating.toFixed(2)),
                                        React.createElement('td', { className: 'py-1 px-2 text-center' }, dish.count),
                                        React.createElement('td', { className: 'py-1 px-2 text-center' }, 
                                            hasComments
                                                ? React.createElement('button', {
                                                    className: 'text-blue-500 hover:text-blue-700 font-bold text-xs',
                                                    onClick: () => toggleComments(dish.dishId)
                                                }, isExpanded ? `▼ Hide (${dish.comments.length})` : `▶ Show (${dish.comments.length})`)
                                                : React.createElement('span', { className: 'text-gray-400 text-xs' }, '-')
                                        )
                                    ])
                                ];
                                
                                // Add expanded comments row
                                if (isExpanded && hasComments) {
                                    rows.push(
                                        React.createElement('tr', { key: `${dish.dishId}-comments`, className: 'bg-blue-50' }, [
                                            React.createElement('td', { colSpan: 5, className: 'py-2 px-4' },
                                                React.createElement('div', { className: 'space-y-2' },
                                                    dish.comments.map((c, cIdx) =>
                                                        React.createElement('div', { 
                                                            key: cIdx, 
                                                            className: 'bg-white p-2 rounded-lg border border-blue-200 text-sm'
                                                        }, [
                                                            React.createElement('span', { className: 'text-gray-500 text-xs' }, `📅 ${c.date} | ⭐ ${c.rating}`),
                                                            React.createElement('p', { className: 'mt-1 text-gray-700' }, c.comment)
                                                        ])
                                                    )
                                                )
                                            )
                                        ])
                                    );
                                }
                                
                                return rows;
                            })
                        )
                    ])
                ]);
            };

            return React.createElement('div', { className: 'space-y-4' }, [
                // Search bar
                React.createElement('div', { className: 'glass-card p-4' }, [
                    React.createElement('div', { className: 'relative' }, [
                        React.createElement('span', { className: 'absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400' }, '🔍'),
                        React.createElement('input', {
                            type: 'text',
                            className: 'input-field pl-10 py-3',
                            placeholder: 'Search for a dish...',
                            value: searchQuery,
                            onChange: e => setSearchQuery(e.target.value)
                        })
                    ])
                ]),
                React.createElement('div', { className: 'glass-card p-4 flex flex-wrap gap-4 items-center justify-between' }, [
                    React.createElement('div', { className: 'flex flex-wrap gap-3 items-center' }, [
                        React.createElement('label', { className: 'text-sm font-bold text-gray-700 flex items-center' }, [
                            React.createElement('span', null, 'Year:'),
                            React.createElement('input', {
                                type: 'number',
                                className: 'ml-2 w-20 input-field py-1 px-2',
                                value: year,
                                onChange: e => setYear(parseInt(e.target.value || new Date().getFullYear(), 10))
                            })
                        ]),
                        React.createElement('label', { className: 'text-sm font-bold text-gray-700 flex items-center' }, [
                            React.createElement('span', null, 'Month:'),
                            React.createElement('select', {
                                className: 'ml-2 input-field py-1 px-2',
                                value: String(month),
                                onChange: e => setMonth(parseInt(e.target.value, 10))
                            }, [
                                React.createElement('option', { key: 1, value: '1' }, 'January'),
                                React.createElement('option', { key: 2, value: '2' }, 'February'),
                                React.createElement('option', { key: 3, value: '3' }, 'March'),
                                React.createElement('option', { key: 4, value: '4' }, 'April'),
                                React.createElement('option', { key: 5, value: '5' }, 'May'),
                                React.createElement('option', { key: 6, value: '6' }, 'June'),
                                React.createElement('option', { key: 7, value: '7' }, 'July'),
                                React.createElement('option', { key: 8, value: '8' }, 'August'),
                                React.createElement('option', { key: 9, value: '9' }, 'September'),
                                React.createElement('option', { key: 10, value: '10' }, 'October'),
                                React.createElement('option', { key: 11, value: '11' }, 'November'),
                                React.createElement('option', { key: 12, value: '12' }, 'December')
                            ])
                        ])
                    ]),
                    React.createElement('button', {
                        className: 'btn-primary px-4 py-2 text-sm',
                        onClick: downloadCsv,
                        disabled: !stats.length
                    }, 'Download CSV')
                ]),
                loading
                    ? React.createElement('p', { className: 'text-center text-blue-500 font-bold' }, 'Loading history...')
                    : React.createElement('div', { className: 'space-y-3' }, [
                        renderTable('Mains', byCategory.main),
                        renderTable('Soups', byCategory.soups),
                        renderTable('Desserts', byCategory.desserts),
                        // No results message
                        searchQuery && !byCategory.main.length && !byCategory.soups.length && !byCategory.desserts.length &&
                            React.createElement('div', { className: 'glass-card p-8 text-center' }, [
                                React.createElement('p', { className: 'text-2xl mb-2' }, '🔍'),
                                React.createElement('p', { className: 'text-gray-500 font-bold' }, `No dishes found matching "${searchQuery}"`)
                            ])
                    ])
            ]);
        }

        // ===== Daily Report Page (for supplier) =====
        function DailyReportPage() {
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [stats, setStats] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const load = async () => {
                    setLoading(true);
                    try {
                        const snap = await db.collection('ratings')
                            .where('todayStr', '==', selectedDate)
                            .get();

                        const map = {};
                        snap.forEach(doc => {
                            const d = doc.data();
                            if (!map[d.dishId]) {
                                map[d.dishId] = {
                                    dishId: d.dishId,
                                    dishName: d.dishName || d.dishId,
                                    category: d.category || 'main',
                                    total: 0,
                                    count: 0,
                                    comments: []
                                };
                            }
                            map[d.dishId].total += d.rating;
                            map[d.dishId].count += 1;
                            if (d.comment && d.comment.trim()) {
                                map[d.dishId].comments.push({
                                    comment: d.comment.trim(),
                                    rating: d.rating
                                });
                            }
                        });

                        const arr = Object.values(map).map(e => ({
                            ...e,
                            avgRating: e.count > 0 ? e.total / e.count : 0
                        }));

                        // Sort by category, then by rating
                        arr.sort((a, b) => {
                            const catOrder = { main: 1, 'plant-based': 2, fish: 3, soups: 4, desserts: 5, 'general-salads': 6, 'general-sides': 7, 'general-cleaning': 8 };
                            const catA = catOrder[a.category] || 99;
                            const catB = catOrder[b.category] || 99;
                            if (catA !== catB) return catA - catB;
                            return b.avgRating - a.avgRating;
                        });

                        setStats(arr);
                    } finally {
                        setLoading(false);
                    }
                };
                load();
            }, [selectedDate]);

            const getRatingBadgeClass = (avg) => {
                const score = parseFloat(avg);
                if (score >= 4.5) return 'rating-great';
                if (score >= 3.5) return 'rating-good';
                if (score >= 2.5) return 'rating-okay';
                if (score >= 1.5) return 'rating-poor';
                return 'rating-bad';
            };

            const getCategoryName = (cat) => {
                const names = {
                    main: '🍖 Main Dishes',
                    'plant-based': '🌱 Plant-Based',
                    fish: '🐟 Fish',
                    soups: '🥣 Soups',
                    desserts: '🍰 Desserts',
                    'general-salads': '🥗 Salads (General)',
                    'general-sides': '🍟 Side Dishes (General)',
                    'general-cleaning': '🧹 Cleaning (General)'
                };
                return names[cat] || cat;
            };

            const downloadDailyReport = () => {
                if (!stats.length) return;
                
                // Build report text
                let report = `MOBILEYE DINING - DAILY REPORT\n`;
                report += `Date: ${selectedDate}\n`;
                report += `Generated: ${new Date().toLocaleString()}\n`;
                report += `${'='.repeat(60)}\n\n`;

                let currentCat = '';
                stats.forEach(s => {
                    if (s.category !== currentCat) {
                        currentCat = s.category;
                        report += `\n${getCategoryName(currentCat)}\n`;
                        report += `${'-'.repeat(40)}\n`;
                    }
                    report += `\n${s.dishName}\n`;
                    report += `  Average Rating: ${s.avgRating.toFixed(2)} (${s.count} votes)\n`;
                    if (s.comments.length > 0) {
                        report += `  Comments:\n`;
                        s.comments.forEach(c => {
                            report += `    - [⭐${c.rating}] ${c.comment}\n`;
                        });
                    }
                });

                // Summary
                const totalVotes = stats.reduce((sum, s) => sum + s.count, 0);
                const avgOverall = stats.length > 0 
                    ? (stats.reduce((sum, s) => sum + s.avgRating * s.count, 0) / totalVotes).toFixed(2)
                    : 'N/A';
                
                report += `\n${'='.repeat(60)}\n`;
                report += `SUMMARY\n`;
                report += `Total items rated: ${stats.length}\n`;
                report += `Total votes: ${totalVotes}\n`;
                report += `Overall average: ${avgOverall}\n`;

                const blob = new Blob([report], { type: 'text/plain;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mobileye-daily-report-${selectedDate}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const groupedByCategory = useMemo(() => {
                const groups = {};
                stats.forEach(s => {
                    if (!groups[s.category]) groups[s.category] = [];
                    groups[s.category].push(s);
                });
                return groups;
            }, [stats]);

            return React.createElement('div', { className: 'space-y-6' }, [
                React.createElement('div', { className: 'text-center mb-4' }, [
                    React.createElement('h2', { className: 'text-3xl font-black text-blue-600 mb-2' }, '📊 Daily Report'),
                    React.createElement('p', { className: 'text-gray-500' }, 'Ratings by day for supplier feedback')
                ]),
                
                // Date selector and download button
                React.createElement('div', { className: 'glass-card p-4 flex flex-wrap gap-4 items-center justify-between' }, [
                    React.createElement('div', { className: 'flex items-center gap-3' }, [
                        React.createElement('label', { className: 'text-sm font-bold text-gray-700' }, 'Select Date:'),
                        React.createElement('input', {
                            type: 'date',
                            className: 'input-field py-2 px-3',
                            value: selectedDate,
                            onChange: e => setSelectedDate(e.target.value)
                        })
                    ]),
                    React.createElement('button', {
                        className: 'btn-primary px-4 py-2 text-sm',
                        onClick: downloadDailyReport,
                        disabled: !stats.length
                    }, '📥 Download Report')
                ]),
                
                loading
                    ? React.createElement('div', { className: 'glass-card p-12 text-center' }, 
                        React.createElement('p', { className: 'text-blue-500 font-bold' }, 'Loading report...'))
                    : stats.length === 0
                        ? React.createElement('div', { className: 'glass-card p-12 text-center' }, [
                            React.createElement('p', { className: 'text-4xl mb-4' }, '📭'),
                            React.createElement('p', { className: 'text-gray-500 font-bold' }, 'No ratings found for this date')
                        ])
                        : React.createElement('div', { className: 'space-y-6' },
                            Object.entries(groupedByCategory).map(([cat, items]) =>
                                React.createElement('div', { key: cat, className: 'glass-card p-4' }, [
                                    React.createElement('h3', { className: 'text-xl font-black text-gray-800 mb-4 text-center' }, getCategoryName(cat)),
                                    React.createElement('div', { className: 'space-y-4' },
                                        items.map(item =>
                                            React.createElement('div', { 
                                                key: item.dishId, 
                                                className: 'bg-white rounded-xl p-4 border-2 border-gray-100'
                                            }, [
                                                React.createElement('div', { className: 'flex flex-wrap items-center justify-between gap-3 mb-2' }, [
                                                    React.createElement('h4', { className: 'text-lg font-bold text-gray-800' }, item.dishName),
                                                    React.createElement('div', { className: 'flex items-center gap-3' }, [
                                                        React.createElement('span', { 
                                                            className: `dish-rating-badge ${getRatingBadgeClass(item.avgRating)}`
                                                        }, [
                                                            '⭐ ',
                                                            item.avgRating.toFixed(2),
                                                            React.createElement('span', { className: 'text-xs opacity-75 ml-1' }, `(${item.count})`)
                                                        ])
                                                    ])
                                                ]),
                                                item.comments.length > 0 && React.createElement('div', { className: 'mt-3 space-y-2' }, [
                                                    React.createElement('p', { className: 'text-sm font-bold text-gray-600' }, `💬 Comments (${item.comments.length}):`),
                                                    React.createElement('div', { className: 'space-y-2 pl-4' },
                                                        item.comments.map((c, idx) =>
                                                            React.createElement('div', { 
                                                                key: idx, 
                                                                className: 'bg-gray-50 p-2 rounded-lg text-sm'
                                                            }, [
                                                                React.createElement('span', { className: 'text-blue-500 mr-2' }, `⭐${c.rating}`),
                                                                React.createElement('span', { className: 'text-gray-700' }, c.comment)
                                                            ])
                                                        )
                                                    )
                                                ])
                                            ])
                                        )
                                    )
                                ])
                            )
                        )
            ]);
        }

        // ===== Weekly Menu Page =====
        function WeeklyMenuPage() {
            const [weeklyData, setWeeklyData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const loadWeeklyMenu = async () => {
                    try {
                        const data = await loadFullMenuJson();
                        setWeeklyData(data);
                    } catch (err) {
                        setError(err.message);
                    } finally {
                        setLoading(false);
                    }
                };
                loadWeeklyMenu();
            }, []);

            const formatDate = (dateStr, dayName) => {
                // Use the day name from JSON data to avoid timezone issues
                const [year, month, day] = dateStr.split('-').map(Number);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return `${dayName}, ${months[month - 1]} ${day}`;
            };

            const isToday = (dateStr) => {
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                return dateStr === today;
            };

            if (loading) {
                return React.createElement('div', { className: 'glass-card p-12 text-center' }, 
                    React.createElement('p', { className: 'text-blue-500 font-bold' }, 'Loading weekly menu...')
                );
            }

            if (error) {
                return React.createElement('div', { className: 'glass-card p-12 text-center' }, 
                    React.createElement('p', { className: 'text-red-500 font-bold' }, `Error: ${error}`)
                );
            }

            if (!weeklyData) {
                return React.createElement('div', { className: 'glass-card p-12 text-center' }, 
                    React.createElement('p', { className: 'text-gray-500 font-bold' }, 'No weekly menu available')
                );
            }

            const sortedDates = Object.keys(weeklyData).sort();

            const renderDishList = (items) => {
                if (!items || items.length === 0) return null;
                return React.createElement('ul', { className: 'space-y-1' },
                    items.filter(item => item.trim()).map((item, idx) =>
                        React.createElement('li', { 
                            key: idx, 
                            className: 'text-gray-700 text-sm text-center py-1' 
                        }, item)
                    )
                );
            };

            return React.createElement('div', { className: 'space-y-6' }, [
                React.createElement('div', { className: 'text-center mb-6' }, [
                    React.createElement('h2', { className: 'text-3xl font-black text-blue-600 mb-2' }, '📅 Weekly Menu'),
                    React.createElement('p', { className: 'text-gray-500' }, 'Plan your meals for the week')
                ]),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                    sortedDates.map(dateStr => {
                        const dayMenu = weeklyData[dateStr];
                        const today = isToday(dateStr);
                        const dayName = dayMenu.dayName || 'Unknown';
                        
                        return React.createElement('div', { 
                            key: dateStr,
                            className: `weekly-day-card ${today ? 'ring-4 ring-blue-400 ring-opacity-50' : ''}`
                        }, [
                            React.createElement('div', { 
                                className: `weekly-day-header ${today ? 'bg-gradient-to-r from-green-500 to-emerald-600' : ''}`
                            }, [
                                React.createElement('div', { className: 'flex justify-between items-center' }, [
                                    React.createElement('span', null, formatDate(dateStr, dayName)),
                                    today && React.createElement('span', { 
                                        className: 'bg-white text-green-600 text-xs font-black px-2 py-1 rounded-full' 
                                    }, 'TODAY')
                                ])
                            ]),
                            React.createElement('div', { className: 'p-4 space-y-4' }, [
                                dayMenu.main && dayMenu.main.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🍖 Main'),
                                    renderDishList(dayMenu.main)
                                ]),
                                dayMenu.plantBased && dayMenu.plantBased.length > 0 && React.createElement('div', { className: 'bg-green-50 rounded-lg p-2 -mx-2' }, [
                                    React.createElement('h4', { className: 'font-black text-green-700 mb-2 text-center' }, '🌱 Plant-Based'),
                                    renderDishList(dayMenu.plantBased)
                                ]),
                                dayMenu.fish && dayMenu.fish.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🐟 Fish'),
                                    renderDishList(dayMenu.fish)
                                ]),
                                dayMenu.soups && dayMenu.soups.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🥣 Soups'),
                                    renderDishList(dayMenu.soups)
                                ]),
                                dayMenu.sides && dayMenu.sides.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🍟 Sides'),
                                    renderDishList(dayMenu.sides)
                                ]),
                                dayMenu.salads && dayMenu.salads.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🥗 Salads'),
                                    renderDishList(dayMenu.salads)
                                ]),
                                dayMenu.desserts && dayMenu.desserts.length > 0 && React.createElement('div', null, [
                                    React.createElement('h4', { className: 'font-black text-gray-800 mb-2 text-center' }, '🍰 Desserts'),
                                    renderDishList(dayMenu.desserts)
                                ])
                            ])
                        ]);
                    })
                )
            ]);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
