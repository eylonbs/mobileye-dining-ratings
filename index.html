<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobileye Dining Ratings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
        body { font-family: 'Fredoka', sans-serif; background-color: #f0f9ff; color: #1e293b; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 2px solid #e0f2fe; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border-radius: 16px; font-weight: 700; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
        .star-rating { cursor: pointer; font-size: 2rem; transition: transform 0.2s ease; }
        .star-rating:hover { transform: scale(1.2); }
        .star-active { color: #fbbf24; filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
        .star-inactive { color: #d1d5db; }
        .input-field { background: white; border: 2px solid #e2e8f0; color: #1e293b; border-radius: 12px; padding: 12px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #3b82f6; }
        .category-badge { padding: 4px 12px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .main-badge { background: #dcfce7; color: #166534; }
        .soup-badge { background: #fef9c3; color: #854d0e; }
        .dessert-badge { background: #fae8ff; color: #86198f; }
        .leaderboard-card { border: 2px solid transparent; background-clip: padding-box; }
        .leaderboard-gold { border-color: #fbbf24; background-color: #fffbeb; }
        .leaderboard-red { border-color: #ef4444; background-color: #fef2f2; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKiGApRlBxU2wd1Y7RIWcDqJxoOpZHORA",
            authDomain: "mobileye-dining-ratings.firebaseapp.com",
            projectId: "mobileye-dining-ratings",
            storageBucket: "mobileye-dining-ratings.firebasestorage.app",
            messagingSenderId: "428654044774",
            appId: "1:428654044774:web:05fb0c7c043c52e8306fa7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [menu, setMenu] = useState(null);
            const [allRatings, setAllRatings] = useState([]);
            const [todayStr] = useState(new Date().toISOString().split('T')[0]);

            useEffect(() => {
                return auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const adminDoc = await db.collection('admins').doc(u.email).get();
                        setIsAdmin(adminDoc.exists);
                    }
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const menuUnsub = db.collection('menus').doc(todayStr).onSnapshot(doc => {
                    setMenu(doc.exists ? doc.data() : null);
                });
                const ratingsUnsub = db.collection('ratings').where('todayStr', '==', todayStr).onSnapshot(snap => {
                    setAllRatings(snap.docs.map(d => d.data()));
                });
                return () => { menuUnsub(); ratingsUnsub(); };
            }, [user]);

            const dishStats = useMemo(() => {
                const stats = {};
                allRatings.forEach(r => {
                    if (!stats[r.dishId]) stats[r.dishId] = { sum: 0, count: 0, dishName: r.dishName, category: r.category };
                    stats[r.dishId].sum += r.rating;
                    stats[r.dishId].count += 1;
                });
                return Object.entries(stats).map(([id, s]) => ({
                    id, ...s, avg: (s.sum / s.count).toFixed(1)
                })).sort((a, b) => b.avg - a.avg);
            }, [allRatings]);

            if (loading) return React.createElement('div', { className: 'flex items-center justify-center min-h-screen text-blue-500 font-bold text-xl' }, 'Gathering the ingredients...');
            if (!user) return React.createElement(Login);

            return React.createElement('div', { className: 'max-w-4xl mx-auto p-4 md:p-8' }, [
                React.createElement('header', { className: 'flex flex-col md:flex-row justify-between items-center mb-12 gap-4', key: 'header' }, [
                    React.createElement('div', { className: 'text-center md:text-left' }, [
                        React.createElement('h1', { className: 'text-4xl md:text-5xl font-black text-blue-600 tracking-tight' }, 'Yum-O-Meter'),
                        React.createElement('p', { className: 'text-blue-400 font-bold flex items-center justify-center md:justify-start gap-2' }, '🚗 MOBILEYE JERUSALEM')
                    ]),
                    React.createElement('div', { className: 'glass-card p-4 flex items-center gap-4' }, [
                        React.createElement('div', { className: 'text-right' }, [
                            React.createElement('p', { className: 'text-sm font-bold text-gray-600' }, user.email),
                            React.createElement('button', { onClick: () => auth.signOut(), className: 'text-xs font-black text-red-500 uppercase' }, '👋 Sign Out')
                        ])
                    ])
                ]),
                isAdmin && React.createElement(AdminPanel, { todayStr, key: 'admin' }),
                dishStats.length > 0 && React.createElement(TopSection, { stats: dishStats, key: 'top' }),
                React.createElement(RatingSection, { menu, todayStr, allRatings, key: 'rating' })
            ]);
        }

        function TopSection({ stats }) {
            const best = stats[0];
            const worst = stats[stats.length - 1];
            
            return React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6 mb-12' }, [
                best && React.createElement('div', { className: 'glass-card p-6 leaderboard-gold animate-pulse-slow' }, [
                    React.createElement('p', { className: 'text-xs font-black text-yellow-600 uppercase mb-2' }, '👑 The Employee Choice'),
                    React.createElement('h3', { className: 'text-xl font-black text-gray-800' }, best.dishName),
                    React.createElement('p', { className: 'text-3xl font-black text-yellow-500 mt-2' }, `⭐ ${best.avg}`)
                ]),
                worst && worst.avg <= 2.5 && React.createElement('div', { className: 'glass-card p-6 leaderboard-red' }, [
                    React.createElement('p', { className: 'text-xs font-black text-red-600 uppercase mb-2' }, '🚫 DON\'T TRUST THE CHEF'),
                    React.createElement('h3', { className: 'text-xl font-black text-gray-800' }, worst.dishName),
                    React.createElement('p', { className: 'text-3xl font-black text-red-500 mt-2' }, `⭐ ${worst.avg}`)
                ])
            ]);
        }

        function Login() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email.toLowerCase().endsWith('@mobileye.com')) {
                    setError('Use @mobileye.com email!');
                    return;
                }
                try {
                    if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
                    else await auth.signInWithEmailAndPassword(email, password);
                } catch (err) { setError(err.message); }
            };

            return React.createElement('div', { className: 'min-h-screen flex items-center justify-center p-4 bg-blue-50' },
                React.createElement('div', { className: 'glass-card p-8 w-full max-w-md text-center' }, [
                    React.createElement('div', { className: 'text-5xl mb-6' }, '🍗'),
                    React.createElement('h2', { className: 'text-3xl font-black text-gray-800 mb-6' }, isRegister ? 'Join Us' : 'Welcome!'),
                    error && React.createElement('p', { className: 'bg-red-50 text-red-500 p-3 rounded-xl mb-6 text-sm' }, error),
                    React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-4' }, [
                        React.createElement('input', { type: 'email', placeholder: 'name@mobileye.com', value: email, onChange: e => setEmail(e.target.value), className: 'input-field', required: true }),
                        React.createElement('input', { type: 'password', placeholder: 'Password', value: password, onChange: e => setPassword(e.target.value), className: 'input-field', required: true }),
                        React.createElement('button', { type: 'submit', className: 'btn-primary w-full py-4' }, isRegister ? 'Register' : 'Sign In')
                    ]),
                    React.createElement('button', { onClick: () => setIsRegister(!isRegister), className: 'mt-6 text-blue-500 font-bold' },
                        isRegister ? 'Login instead' : 'Create account')
                ])
            );
        }

        function AdminPanel({ todayStr }) {
            const [form, setForm] = useState({ main: ['', '', '', ''], soups: ['', ''], desserts: ['', '', ''] });

            useEffect(() => {
                db.collection('menus').doc(todayStr).get().then(doc => {
                    if (doc.exists) setForm(doc.data());
                });
            }, [todayStr]);

            const save = () => db.collection('menus').doc(todayStr).set(form);

            const InputGroup = (label, type, size) => React.createElement('div', { className: 'space-y-2' }, [
                React.createElement('h4', { className: 'font-black text-gray-600' }, label),
                ...Array(size).fill(0).map((_, i) => React.createElement('input', {
                    key: i,
                    placeholder: `Option ${i + 1}`,
                    value: form[type][i],
                    onChange: e => {
                        const newArr = [...form[type]];
                        newArr[i] = e.target.value;
                        setForm({ ...form, [type]: newArr });
                    },
                    className: 'input-field'
                }))
            ]);

            return React.createElement('div', { className: 'glass-card p-6 mb-12' }, [
                React.createElement('h3', { className: 'text-xl font-black mb-6 text-blue-600' }, 'MANAGER DASHBOARD'),
                React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6 mb-6' }, [
                    InputGroup('Main Dishes', 'main', 4),
                    InputGroup('Soups', 'soups', 2),
                    InputGroup('Desserts', 'desserts', 3)
                ]),
                React.createElement('button', { onClick: save, className: 'btn-primary px-8 py-3' }, 'Update Menu ✨')
            ]);
        }

        function RatingSection({ menu, todayStr, allRatings }) {
            if (!menu) return React.createElement('div', { className: 'glass-card p-12 text-center' }, 'Waiting for today\'s menu...');

            return React.createElement('div', { className: 'space-y-12' }, [
                React.createElement(RatingGroup, { title: 'Main Dishes', items: menu.main, type: 'main', todayStr, allRatings, badgeClass: 'main-badge', icon: '🍖' }),
                React.createElement(RatingGroup, { title: 'Today\'s Soups', items: menu.soups, type: 'soups', todayStr, allRatings, badgeClass: 'soup-badge', icon: '🥣' }),
                React.createElement(RatingGroup, { title: 'Sweet Desserts', items: menu.desserts, type: 'desserts', todayStr, allRatings, badgeClass: 'dessert-badge', icon: '🍰' })
            ]);
        }

        function RatingGroup({ title, items, type, todayStr, allRatings, badgeClass, icon }) {
            const filteredItems = (items || []).filter(i => i.trim() !== '');
            if (filteredItems.length === 0) return null;

            const user = auth.currentUser;
            const hasRatedAnyInCategory = allRatings.some(r => r.userId === user.uid && r.category === type);

            return React.createElement('section', null, [
                React.createElement('div', { className: 'flex items-center gap-3 mb-6' }, [
                    React.createElement('span', { className: 'text-3xl' }, icon),
                    React.createElement('h2', { className: 'text-2xl font-black text-gray-800' }, title)
                ]),
                React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' },
                    filteredItems.map((item, idx) => React.createElement(DishCard, { 
                        key: idx, 
                        dishName: item, 
                        category: type, 
                        todayStr, 
                        allRatings,
                        badgeClass,
                        isLocked: hasRatedAnyInCategory
                    }))
                )
            ]);
        }

        function DishCard({ dishName, category, todayStr, allRatings, badgeClass, isLocked }) {
            const [comment, setComment] = useState('');
            const user = auth.currentUser;
            const dishId = `${todayStr}_${category}_${dishName}`;
            
            const myRating = allRatings.find(r => r.userId === user.uid && r.dishId === dishId);
            const othersRatings = allRatings.filter(r => r.dishId === dishId);
            const avg = othersRatings.length ? (othersRatings.reduce((a, b) => a + b.rating, 0) / othersRatings.length).toFixed(1) : 0;

            const submitRating = async (r) => {
                if (isLocked && !myRating) return;
                const docId = `${user.uid}_${dishId}`;
                await db.collection('ratings').doc(docId).set({
                    userId: user.uid, dishId, dishName, category, todayStr,
                    rating: r, comment, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            return React.createElement('div', { className: `glass-card p-6 flex flex-col h-full transition-all ${myRating ? 'border-green-300 bg-green-50' : isLocked ? 'opacity-50 grayscale cursor-not-allowed' : 'hover:border-blue-300'}` }, [
                React.createElement('div', { className: 'flex justify-between items-start mb-4' }, [
                    React.createElement('span', { className: `category-badge ${badgeClass}` }, category),
                    othersRatings.length > 0 && React.createElement('div', { className: 'text-right font-black text-gray-800' }, `⭐ ${avg}`)
                ]),
                React.createElement('h3', { className: 'text-xl font-black text-gray-800 mb-6 flex-grow' }, dishName),
                React.createElement('div', { className: 'flex justify-center gap-2 mb-6' },
                    [1, 2, 3, 4, 5].map(star => React.createElement('span', {
                        key: star,
                        onClick: () => submitRating(star),
                        className: `star-rating ${star <= (myRating?.rating || 0) ? 'star-active' : 'star-inactive'}`
                    }, star <= (myRating?.rating || 0) ? '⭐' : '☆'))
                ),
                myRating && React.createElement('input', {
                    placeholder: 'Edit comment...', value: comment || myRating.comment,
                    onChange: e => setComment(e.target.value),
                    onBlur: () => submitRating(myRating.rating),
                    className: 'input-field text-sm font-medium'
                })
            ]);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
