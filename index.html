<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobileye Dining Ratings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Emergency Debug
        console.log('App starting...');
        document.getElementById('root').innerHTML = '<div style="padding: 20px;">Initializing Mobileye Dining Ratings...</div>';

        const firebaseConfig = {
            apiKey: "AIzaSyBKiGApRlBxU2wd1Y7RIWcDqJxoOpZHORA",
            authDomain: "mobileye-dining-ratings.firebaseapp.com",
            projectId: "mobileye-dining-ratings",
            storageBucket: "mobileye-dining-ratings.firebasestorage.app",
            messagingSenderId: "428654044774",
            appId: "1:428654044774:web:05fb0c7c043c52e8306fa7"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();
            const provider = new firebase.auth.GoogleAuthProvider();

            const { useState, useEffect } = React;

            function App() {
                const [user, setUser] = useState(null);
                const [loading, setLoading] = useState(true);

                useEffect(() => {
                    return auth.onAuthStateChanged(u => {
                        setUser(u);
                        setLoading(false);
                    });
                }, []);

                if (loading) return React.createElement('div', {style: {padding: '20px'}}, 'Loading...');

                if (!user) {
                    return React.createElement('div', {style: {padding: '20px', textAlign: 'center'}}, [
                        React.createElement('h1', null, 'Mobileye Dining'),
                        React.createElement('button', {
                            onClick: () => auth.signInWithPopup(provider),
                            style: {padding: '10px 20px', cursor: 'pointer'}
                        }, 'Sign in with Google')
                    ]);
                }

                return React.createElement('div', {style: {padding: '20px'}}, [
                    React.createElement('h1', null, 'Welcome, ' + user.displayName),
                    React.createElement('button', {onClick: () => auth.signOut()}, 'Sign Out')
                ]);
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(React.createElement(App));
        } catch (e) {
            console.error(e);
            document.getElementById('root').innerHTML = '<div style="color: red; padding: 20px;">Error: ' + e.message + '</div>';
        }
    </script>
</body>
</html>
