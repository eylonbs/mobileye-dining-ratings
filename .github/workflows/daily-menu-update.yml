name: Daily Menu Update

# One run at a time so back-to-back Drive uploads do not race on menu.csv / JSON commits
concurrency:
  group: menu-pipeline-${{ github.repository }}
  cancel-in-progress: false

on:
  schedule:
    # Run every day at 6 AM Israel time (4 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    paths:
      - 'menu.csv'
      - 'scripts/scrape-and-upload.js' # Regenerate JSON when the CSV→JSON pipeline changes
      - '.github/workflows/daily-menu-update.yml'
  repository_dispatch:
    types: [menu-pdf-upload]  # Triggered by Google Apps Script when PDF is uploaded

# Give the workflow permission to push commits
permissions:
  contents: write

jobs:
  # Job 1: Parse PDF from Google Drive (only runs on PDF upload trigger)
  parse-pdf:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'menu-pdf-upload'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --ignore-scripts
      
      - name: Download and parse PDF
        env:
          TZ: Asia/Jerusalem
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          PDF_FILE_ID: ${{ github.event.client_payload.file_id }}
          # Optional override; parse script defaults to production menu folder if unset
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: node scripts/parse-pdf-menu.js
      
      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update menu.csv from PDF (${{ github.event.client_payload.file_name }})"
          file_pattern: "menu.csv"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # Job 2: Generate JSON and upload to Firebase (runs on all triggers)
  update-menu:
    runs-on: ubuntu-latest
    needs: [parse-pdf]
    if: always() && (needs.parse-pdf.result == 'success' || needs.parse-pdf.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      
      - name: Sync to latest on branch (pick up menu.csv from parse-pdf)
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --ignore-scripts
      
      - name: Generate JSON and upload to Firebase
        env:
          TZ: Asia/Jerusalem
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/scrape-and-upload.js
      
      - name: Commit and push JSON file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update menu JSON from CSV"
          file_pattern: "menu-data-*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
