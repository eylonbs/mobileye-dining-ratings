name: Daily Menu Update

on:
  schedule:
    # Run every day at 6 AM Israel time (4 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    paths:
      - 'menu.csv'  # Also run when menu.csv is updated
  repository_dispatch:
    types: [menu-pdf-upload]  # Triggered by Google Apps Script when PDF is uploaded

# Give the workflow permission to push commits
permissions:
  contents: write

jobs:
  # Job 1: Parse PDF from Google Drive (only runs on PDF upload trigger)
  parse-pdf:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'menu-pdf-upload'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --ignore-scripts
      
      - name: Download and parse PDF
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          PDF_FILE_ID: ${{ github.event.client_payload.file_id }}
        run: node scripts/parse-pdf-menu.js
      
      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update menu.csv from PDF (${{ github.event.client_payload.file_name }})"
          file_pattern: "menu.csv"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # Job 2: Generate JSON and upload to Firebase (runs on all triggers)
  update-menu:
    runs-on: ubuntu-latest
    needs: [parse-pdf]
    if: always() && (needs.parse-pdf.result == 'success' || needs.parse-pdf.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      
      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install --ignore-scripts
      
      - name: Generate JSON and upload to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/scrape-and-upload.js
      
      - name: Commit and push JSON file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update menu JSON from CSV"
          file_pattern: "menu-data-*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
