name: Daily Menu Update

on:
  schedule:
    # Run every day at 6 AM Israel time (4 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Scrape and upload menu
        env:
                  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUrun: node scripts/scrape-and-upload.js                        run: node scripts/scrape-and-upload.j
